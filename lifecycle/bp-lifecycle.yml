versioning:
  scheme: major-in-path
  detail: >-
    The version is carried as a path segment (v{version}) in the base URL, and Aral AppConnect
    additionally accepts an api-version request header. Product versions are pinned in the
    product code itself (e.g. FLEET_CARD_MANAGEMENT_1.0).
  current_versions:
