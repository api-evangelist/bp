deprecation:
  policy_published: false
  sunset_header: not published
  deprecation_header: not published
  rfc8594: false
  deprecated_operations: []
  detail: >-
    No deprecation or sunset policy is published, and no operation in any of the six OpenAPI
    documents carries deprecated: true. Because every product is still on its first major version,
    BP has not yet had to retire anything publicly.
sla:
  published: false
  detail: No uptime commitment, support-response target or credit scheme is published on the portal.
roadmap:
  published: partially
  detail: >-
    Not a dated roadmap, but BP states forward intent inside the Card Management API description:
    "We are currently only exposing a single endpoint allowing to get your latest card updates.
    We have a series of endpoints under development that should be released over the coming few
    months."
support:
  channel: portal support page
  url: https://developer.fleet.bp.com/DE/support
  detail: >-
    An FAQ plus a contact form. BP asks that an API error report include the correlation id.
    A group mailbox is published on the page; individual named-employee addresses also appear
    there and are deliberately not recorded here.
