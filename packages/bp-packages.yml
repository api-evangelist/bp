gaps:
  - >-
    No client library exists for any of the six bp Open Fleet APIs in any language. Integrators
    must hand-roll the OAuth client-credentials exchange and the request signing.
  - >-
    The `dasher` package on PyPI shares a name with BP's github.com/bp/dasher repository but is
    an unrelated project by a different author (mfaafm, a plotly-dash tool). It is deliberately
    NOT recorded as a BP package.
