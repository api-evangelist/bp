description: BP (British Petroleum) is one of the world's largest integrated energy companies, operating
  in over 70 countries across oil and gas exploration, production, refining, distribution, marketing,
  petrochemicals, power generation and renewable energy. BP runs two distinct public API surfaces. The
  bp Open Fleet Developer Portal (developer.fleet.bp.com) publishes six machine-readable OpenAPI 3.0.1
  contracts covering fleet-card management, invoicing, fuel transactions, retail site information and
  Aral AppConnect pay-at-pump authorization, secured with OAuth2 client credentials against api.fleet.bp.com
  and a matching sandbox. The bp API Marketplace (developer.bp.com) is a white-labelled RapidAPI Enterprise
  Hub whose catalogue sits behind a login. Access to both is aimed at existing B2B fleet and mobility
  customers rather than public self-serve signup.
apis:
- aid: bp:bp-api-marketplace
  name: BP API Marketplace
  tags:
  - Energy
  - Oil
  - Gas
  - Developer Platform
  humanURL: https://developer.bp.com/hub
  properties:
  - type: Portal
    url: https://developer.bp.com/hub
  - type: Documentation
    url: https://developer.bp.com/bp%20API%20Marketplace%20User%20Guide.pdf
  - type: Login
    url: https://api.developer.bp.com/auth
  description: 'The bp API Marketplace is a white-labelled RapidAPI Enterprise Hub developer portal for
    BP''s digital APIs. It provides API discovery, a testing playground, documentation, usage monitoring,
    error and latency tracking, and billing and subscription management. The catalogue itself requires
    a BP Developer Account: BP''s own user guide states some APIs are only visible after sign-in. No machine-readable
    contract was reachable anonymously.'
- aid: bp:bp-fleet-authentication
  name: bp Open Fleet Authentication API
  tags:
  - Energy
  - Fleet
  - Authentication
  - OAuth
  - Developer Platform
  humanURL: https://developer.fleet.bp.com/DE/apis/authentication
  baseURL: https://api.fleet.bp.com/authentication/v1.0/
  description: 'Token endpoint for the bp Open Fleet platform. POST /token exchanges a client_id and client_secret
    for a bearer access_token used by every other Open Fleet API. Credentials are bound to a single environment:
    sandbox credentials only reach sandbox endpoints. Published rate limit 10 requests per minute, the
    tightest on the platform, so tokens must be cached and reused.'
  properties:
  - type: OpenAPI
    url: openapi/bp-fleet-authentication-openapi.json
  - type: Overlay
    url: overlays/bp-fleet-authentication-overlay.yaml
  - type: APIReference
    url: https://developer.fleet.bp.com/DE/apis/authentication
  - type: Documentation
    url: https://developer.fleet.bp.com/DE/getting-started
- aid: bp:bp-fleet-card-management
  name: bp Open Fleet Card Management API
  tags:
  - Energy
  - Fleet
  - Fuel Cards
  - Cards
  - Developer Platform
  humanURL: https://developer.fleet.bp.com/DE/apis/card-management
  baseURL: https://api.fleet.bp.com/{apiPrefix}/v1/
  description: Fuel-card management for bp and Aral fleet customers. Currently exposes a single read operation,
    GET /cards, returning the latest card updates filtered by authority, parent account, card status and
    a required date window. BP states further endpoints are under development. Available in AT, BE, DE,
    LU, NL, PL, PT, ES and UK. Published rate limit 10 requests per minute.
  properties:
  - type: OpenAPI
    url: openapi/bp-fleet-card-management-openapi.json
  - type: Overlay
    url: overlays/bp-fleet-card-management-overlay.yaml
  - type: APIReference
    url: https://developer.fleet.bp.com/DE/apis/card-management
  - type: Documentation
    url: https://developer.fleet.bp.com/DE/getting-started
