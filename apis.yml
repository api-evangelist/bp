- aid: bp:bp-fleet-transaction-management
  name: bp Open Fleet Transaction Management API
  tags:
  - Energy
  - Fleet
  - Transactions
  - Fuel Cards
  - Developer Platform
  humanURL: https://developer.fleet.bp.com/DE/apis/transaction-management
  baseURL: https://api.fleet.bp.com/{apiPrefix}/v1.0/
  description: Direct access to fleet fuel transaction data. GET /transactions returns full transaction
    detail including product breakdowns, site location, driver and vehicle information, discounts, taxes
    and invoicing status, searchable by vehicle registration, cardholder, invoice number, country and
    date. The widest entity on the platform at 77 response properties. Available in AT, BE, DE, LU, NL,
    PL, PT, ES and UK. Published rate limit 10 requests per minute.
  properties:
  - type: OpenAPI
    url: openapi/bp-fleet-transaction-management-openapi.json
  - type: Overlay
    url: overlays/bp-fleet-transaction-management-overlay.yaml
  - type: APIReference
    url: https://developer.fleet.bp.com/DE/apis/transaction-management
  - type: Documentation
    url: https://developer.fleet.bp.com/DE/getting-started
- aid: bp:bp-fleet-retail-site-information
  name: bp Open Fleet Retail Site Information API
  tags:
  - Energy
  - Retail Fuel
  - Sites
  - Location
  - EV Charging
  - Developer Platform
  humanURL: https://developer.fleet.bp.com/DE/apis/retail-site-information-anz
  baseURL: https://api.fleet.bp.com/{apiPrefix}/v1.0/
  description: Comprehensive bp and Aral retail site data. GET /sites returns address, contact details,
    retail site features such as ATM and car wash, operating hours and holiday schedules, site amenities,
    fuel and non-fuel products, and EV charging availability, filtered by a required CountryCode. The
    only Open Fleet product with no sandbox environment. Published rate limit 100 requests per second.
  properties:
  - type: OpenAPI
    url: openapi/bp-fleet-retail-site-information-openapi.json
  - type: Overlay
    url: overlays/bp-fleet-retail-site-information-overlay.yaml
  - type: APIReference
    url: https://developer.fleet.bp.com/DE/apis/retail-site-information-anz
  - type: Documentation
    url: https://developer.fleet.bp.com/DE/getting-started
- aid: bp:bp-fleet-aral-appconnect
  name: bp Open Fleet Aral AppConnect (Pay@Pump) API
  tags:
  - Energy
  - Retail Fuel
  - Payments
  - Mobility
  - Fleet
  - Developer Platform
  humanURL: https://developer.fleet.bp.com/DE/apis/aral-appconnect
  baseURL: https://api.fleet.bp.com/{apiPrefix}/v1/
  description: Digital fuel authorization at bp and Aral stations. Drivers authorize a fuel card directly
    from the vehicle, avoiding the till; the card is linked to a driver, vehicle or onboard computer and
    only the appropriate nozzle is released. Eight operations cover site search by coordinate and radius,
    site detail, payment-method registration and removal, and starting, checking and cancelling a fuelling
    session. Authorizations are tokenized and validated against existing fuel card controls including
    velocity limits and site restrictions. The only write surface on the platform, and it has no idempotency
    mechanism. Germany only. Published rate limit 100 requests per second.
  properties:
  - type: OpenAPI
    url: openapi/bp-fleet-aral-appconnect-openapi.json
  - type: Overlay
    url: overlays/bp-fleet-aral-appconnect-overlay.yaml
  - type: APIReference
    url: https://developer.fleet.bp.com/DE/apis/aral-appconnect
  - type: Documentation
    url: https://developer.fleet.bp.com/DE/getting-started
