specification: API Commons Plans
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/Plans
provider: BP
providerId: bp
created: '2026-05-04'
modified: '2026-09-04'
generated: '2026-09-04'
method: searched
source: https://developer.fleet.bp.com/DE/apis
note: >-
  REPLACES a 2026-05-04 scaffold that invented three tiers (bp-free 1,000 req/month,
  bp-pro 100,000 req/month, bp-enterprise) with invented quotas and TBD prices. BP publishes
  none of that. This file now records the measured absence instead.
tags:
  - Energy
  - Oil
  - Gas
  - Fleet
description: >-
  BP publishes no public plans, tiers or prices for either of its API surfaces. Access to the
  bp Open Fleet APIs is granted to existing B2B fleet-card customers through an account
  relationship, not purchased from a public pricing page.
plan_count: 0
plans: []
access_model:
  model: business-relationship
  public_signup: false
  detail: >-
    The Open Fleet portal offers Sign up / Login, but the APIs are addressed to existing bp and
    Aral fleet-card customers — the products are Card Management, Invoice Management and
    Transaction Management over the caller's own fleet accounts. Credentials are provisioned per
    environment through the portal rather than issued instantly on signup.
evidence:
  - url: https://developer.fleet.bp.com/DE/apis
    status: 200
    finding: >-
      Six API products listed with descriptions, country availability and rate limits. No price,
      tier, quota or billing field appears on any product entry.
  - url: https://developer.fleet.bp.com/DE/pricing
    status: 403
    finding: No pricing route exists on the Open Fleet portal.
  - url: https://api.developer.bp.com/hub/pricing
    status: 200
    finding: >-
      Soft-404. Returns the same 152KB Next.js shell as https://api.developer.bp.com/hub/zzz-fake-99
      — not a pricing page.
  - url: https://api.developer.bp.com/hub
    status: 200
    finding: >-
      The bp API Marketplace catalogue is behind a login; BP's own user guide states some APIs are
      only visible after sign-in and that billing/subscription management lives inside the
      authenticated dashboard.
